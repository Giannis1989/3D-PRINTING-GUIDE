name: AI Document Review

on:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Κάνε review στα .md αρχεία που άλλαξαν σε αυτό το PR.
            Βρες ορθογραφικά λάθη, ασάφειες και λάθος πληροφορίες,
            και πρότεινε διορθώσεις.
